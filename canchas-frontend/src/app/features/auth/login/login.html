<div class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <span class="login__etiqueta">UC2 · Iniciar sesión</span>
    <h1 class="login__titulo">Canchas Samanes</h1>
    <p class="login__subtitulo">Reserva y gestión de canchas de fútbol</p>

    <div class="login__campo">
      <label for="correo">Correo electrónico</label>
      <input id="correo" type="email" pInputText formControlName="correo" placeholder="admin@samanes.ec" />
    </div>

    <div class="login__campo">
      <label for="password">Contraseña</label>
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="login__password"
      />
    </div>

    @if (error()) {
      <p-message severity="error" [text]="error()!" styleClass="login__error" />
    }

    <p-button
      type="submit"
      label="Ingresar"
      styleClass="login__submit"
      [loading]="cargando()"
      [fluid]="true"
    />

    <span class="login__pie">Parque Samanes · Guayaquil</span>
    <span class="login__pie"><a routerLink="/registro">Crear una cuenta nueva</a></span>
  </form>
</div>
